services:
  - type: web
    name: perfume-budget-dev
    env: docker
    plan: free
    branch: dev
    healthCheckPath: /actuator/health
    envVars:
      - key: ACTIVE_PROFILE
        value: prod
      - key: DB_URL
        sync: false
      # SECURITY (PLAT-02b, known limitation): master.tenant_audit_log rejects UPDATE/DELETE/TRUNCATE through its triggers, but the
      # table OWNER can drop them. The app currently runs migrations, tenant DDL and queries with ONE role (the owner), so the
      # trail is not tamper-proof against a compromised app credential or DB admin; a non-owner runtime role needs code changes
      # (tracked as SEC-01) and is not available yet. See docs/api/platform-tenants.md "Deployment notes".
      # Run ONE instance of this service: the CORS cache invalidation after platform actions is per JVM (other instances lag
      # by up to ~150 s).
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PLATFORM_ENCRYPTION_KEY
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_ACCESS_EXPIRATION
        sync: false
      - key: JWT_REFRESH_EXPIRATION
        sync: false
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        sync: false
      - key: SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
        sync: false
      - key: SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE
        sync: false
      - key: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
        sync: false
      - key: SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST
        sync: false
      - key: SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_PROTOCOLS
        sync: false
      - key: OAUTH2_CALLBACK_BASE_URL
        sync: false
      - key: OAUTH2_REDIRECT_URIS
        sync: false
      - key: PLATFORM_API_BASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Platform super-admin bootstrap: optional, may be removed once the first admin exists (never alters an existing admin)
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: PLATFORM_ADMIN_FULL_NAME
        sync: false
      - key: FRONTEND_CHANGE_PASSWORD_URL
        sync: false
      # Optional: non-tenant origins only (tenant subdomains/custom domains are allowed dynamically from the registry)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Platform-admin console origin(s) for /api/v1/platform/**; unset = platform API unreachable from browsers
      - key: PLATFORM_CORS_ALLOWED_ORIGINS
        sync: false
      - key: TENANT_BASE_DOMAIN
        sync: false
      - key: TENANT_PLATFORM_DOMAINS
        sync: false

  - type: redis
    name: perfume-redis
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction