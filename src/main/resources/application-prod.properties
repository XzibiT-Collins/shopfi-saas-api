# Production profile (ACTIVE_PROFILE=prod). Every secret and deployment-specific URL is read from an
# environment variable with NO default: a missing value fails startup instead of falling back to
# something insecure. Never put real values in this file. See DEPLOYMENT section in QUICK_START.md.
server.port=${PORT:${SERVER_PORT:8080}}

# Database (Postgres, schema-per-tenant). Hibernate only validates; Flyway is driven programmatically.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.multiTenancy=SCHEMA
spring.datasource.hikari.connection-init-sql=SET search_path TO tenant_template
spring.flyway.enabled=false
spring.data.web.pageable.max-page-size=50

# JWT
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_ACCESS_EXPIRATION}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION}

spring.servlet.multipart.max-file-size=20MB

# Actuator: no detail leak to anonymous callers
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never
management.endpoint.prometheus.access=read_only
management.metrics.tags.application=${spring.application.name}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Mail
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST}
spring.mail.properties.mail.smtp.ssl.protocols=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_PROTOCOLS}
spring.mail.properties.mail.debug=false
notification.email.provider=${NOTIFICATION_EMAIL_PROVIDER:smtp}
notification.email.from-address=${NOTIFICATION_EMAIL_FROM_ADDRESS:${spring.mail.username}}
notification.email.from-name=${NOTIFICATION_EMAIL_FROM_NAME:Perfume Budget}
notification.email.resend.api-key=${RESEND_API_KEY:}
notification.email.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:true}

# Redis
spring.data.redis.url=${REDIS_URL}
redis.cache.ttl.minutes=${REDIS_CACHE_TTL_MINUTES:10}

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH2_CALLBACK_BASE_URL}/oauth2/callback/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
application.oauth2.authorized-redirect-uris=${OAUTH2_REDIRECT_URIS}
application.oauth2.cookie-expiry-seconds=180

# Payments (per-tenant secrets are stored encrypted with the platform key)
paystack.url=${PAYSTACK_URL:https://api.paystack.co}
platform.encryption.key=${PLATFORM_ENCRYPTION_KEY}
platform.api-base-url=${PLATFORM_API_BASE_URL}

# Cloudinary
storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
storage.cloudinary.api-key=${CLOUDINARY_API_KEY}
storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Data seeding
perfume.budget.admin.email=${ADMIN_EMAIL}
perfume.budget.admin.password=${ADMIN_PASSWORD}

frontend.change-password-url=${FRONTEND_CHANGE_PASSWORD_URL}

# CORS: explicit allow-list, no localhost defaults
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Cookies: HTTPS only
application.security.cookie.secure=true
application.security.cookie.same-site=None

# Tenant resolution. Subdomain/custom-domain only: header resolution and dev endpoints are OFF.
tenant.platform-domains=${TENANT_PLATFORM_DOMAINS}
tenant.base-domain=${TENANT_BASE_DOMAIN}
tenant.header-name=X-Tenant-ID
tenant.header-resolution.enabled=false
tenant.dev-endpoints.enabled=false
# No dev redirect hosts (explicitly emptied; the class default would otherwise be localhost,127.0.0.1)
tenant.oauth2.dev-allowed-redirect-hosts=
