spring.application.name=perfume_budget
# No default profile on purpose: an unset ACTIVE_PROFILE must never silently select dev-only behaviour
# (header tenant resolution, dev endpoints). Set ACTIVE_PROFILE=dev locally, ACTIVE_PROFILE=prod in production.
spring.profiles.active=${ACTIVE_PROFILE:}

# Reverse-proxy trust (PROV-02b). NEVER use "framework" here: Spring's ForwardedHeaderFilter makes
# request.getRemoteAddr() the LEFTMOST X-Forwarded-For entry, which any client can choose, defeating per-IP rate
# limits. "native" lets Tomcat's RemoteIpValve resolve the client: it walks X-Forwarded-For from the right, skips
# hops matching internal-proxies (our own proxy tier) and takes the first untrusted hop; if the direct peer is not
# a trusted proxy the forwarding headers are ignored entirely. X-Real-IP and Forwarded are never consulted.
# internal-proxies defaults to the private/loopback ranges (what Render's router and local proxies use); if another
# proxy tier sits in front (e.g. a CDN), set TRUSTED_PROXY_REGEX to cover ALL of your proxies and only them.
# Shared by every profile (dev and prod) so they cannot drift; see QUICK_START.md "Reverse proxy".
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_REGEX:10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(?:1[6-9]|2\\d|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1|fe[89ab][0-9a-f]:.*|f[cd][0-9a-f]{2}:.*}

# Open Session In View disabled: it opens one Hibernate session at request start (fixing the
# tenant before TenantContext may be set) and holds the connection for the whole request. Both
# are hostile to schema-per-tenant routing (provisioning switches tenant mid-request; connection
# release must reset search_path). Services return DTOs mapped inside their @Transactional
# boundary, so no lazy relation escapes to the view layer.
spring.jpa.open-in-view=false

# CORS Config
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:4200,https://perfume-budget-gs-fe.vercel.app}
# Tenant storefront/admin origins are NOT listed: they come from the tenant registry (DOMAIN-01, docs/api/cors.md).
# This list is only for non-tenant origins (local dev, a shared console). Methods/headers are explicit, never '*'
# (credentials are allowed). Cookies are the credential, so Authorization is deliberately not allowed.
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Content-Type,Accept,If-Match,If-None-Match}
cors.exposed-headers=ETag,Retry-After
# Registry decisions are cached: a suspension propagates within ttl-seconds (denials are cached negative-ttl-seconds).
cors.tenant-cache.ttl-seconds=${CORS_TENANT_CACHE_TTL_SECONDS:30}
cors.tenant-cache.negative-ttl-seconds=${CORS_TENANT_CACHE_NEGATIVE_TTL_SECONDS:10}
# Platform control plane CORS (/api/v1/platform/**): ONLY these origins, never tenant origins. Empty = no browser origin.
platform.cors.allowed-origins=${PLATFORM_CORS_ALLOWED_ORIGINS:}

# Notification Config
notification.email.provider=${NOTIFICATION_EMAIL_PROVIDER:smtp}
notification.email.from-address=${NOTIFICATION_EMAIL_FROM_ADDRESS:${spring.mail.username:}}
notification.email.from-name=${NOTIFICATION_EMAIL_FROM_NAME:Perfume Budget}
notification.email.resend.api-key=${RESEND_API_KEY:}
notification.email.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:true}

# Reserved inventory cleanup
inventory.reservation.expiry-hours=${INVENTORY_RESERVATION_EXPIRY_HOURS:1}
inventory.reservation.cleanup-interval-ms=${INVENTORY_RESERVATION_CLEANUP_INTERVAL_MS:900000}

# Discount cache eviction: clears product caches so date-windowed discounts surface/revert promptly
discount.cache-evict-interval-ms=${DISCOUNT_CACHE_EVICT_INTERVAL_MS:600000}
# THEME-04: contract cap for PUT /api/v1/theme multipart (12 MB, theme-contract.md 7.2). Tomcat aborts the stream past this (also the global ceiling).
spring.servlet.multipart.max-request-size=12MB

# THEME-04c: dedicated spool directory for multipart parts (Tomcat writes every part to disk: file-size-threshold is 0).
# Created (0700) and EMPTIED at startup by MultipartTempDirInitializer, so files orphaned by a crash/kill are reclaimed.
# Requests are removed by Tomcat when they finish; a throttled/unauthenticated theme PUT is rejected before parsing.
# Override with MULTIPART_TMP_DIR to put it on a bigger/dedicated volume. Must not be shared with anything else.
spring.servlet.multipart.location=${MULTIPART_TMP_DIR:${java.io.tmpdir}/shopfi-multipart}
