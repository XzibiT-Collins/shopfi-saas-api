# Layered on top of application-test.properties by AbstractPostgresIntegrationTest
# (@ActiveProfiles({"test","pgtest"})). Datasource url/user/password are injected from env vars
# (SHOPFI_TEST_DB_URL/USER/PASSWORD) via @DynamicPropertySource.
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.multiTenancy=SCHEMA
# Neutral schema Hibernate validates against; Flyway is driven by TenantFlywayInitializer, not autoconfig
spring.datasource.hikari.connection-init-sql=SET search_path TO tenant_template
spring.flyway.enabled=false
spring.datasource.hikari.maximum-pool-size=10

# Tenant resolution defaults for TENANT-03/04/05 (dev-style X-Tenant-ID header allowed in tests)
tenant.platform-domains=localhost,127.0.0.1
tenant.base-domain=
tenant.header-name=X-Tenant-ID
tenant.header-resolution.enabled=true
